apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile-config
  namespace: locust
  labels:
    app: locust
    component: config

data:
  locustfile.py: |
    from locust import HttpUser, task, between
    
    class MyUser(HttpUser):
        wait_time = between(1, 5)
        
        @task
        def my_task(self):
            self.client.get("/")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: locust
  labels:
    app: locust
    role: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
      role: master
  template:
    metadata:
      labels:
        app: locust
        role: master
    spec:
      containers:
      - name: locust
        image: locustio/locust
        args: ["-f", "/mnt/locust/locustfile.py", "--master", "-H", "http://movies-api:3000"]
        ports:
        - containerPort: 8089
        - containerPort: 5557
        - containerPort: 5558
        volumeMounts:
        - name: locustfile-volume
          mountPath: /mnt/locust
      volumes:
      - name: locustfile-volume
        configMap:
          name: locustfile-config
      dnsPolicy: ClusterFirst
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: locust
  labels:
    app: locust
    role: master
spec:
  selector:
    app: locust
    role: master
  ports:
  - name: web
    port: 8089
    targetPort: 8089
  - name: comms
    port: 5557
    targetPort: 5557
  - name: comms-alt
    port: 5558
    targetPort: 5558
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: locust
  labels:
    app: locust
    role: worker
spec:
  replicas: 8  # Ajusta el número de workers
  selector:
    matchLabels:
      app: locust
      role: worker
  template:
    metadata:
      labels:
        app: locust
        role: worker
    spec:
      containers:
      - name: locust
        image: locustio/locust
        args: ["-f", "/mnt/locust/locustfile.py", "--worker", "--master-host=locust-master"]
        volumeMounts:
        - name: locustfile-volume
          mountPath: /mnt/locust
      volumes:
      - name: locustfile-volume
        configMap:
          name: locustfile-config
      dnsPolicy: ClusterFirst
